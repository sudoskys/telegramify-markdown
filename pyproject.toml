[project]
name = "telegramify-markdown"
version = "1.3.0"
description = "Convert Markdown to Telegram plain text + MessageEntity pairs"
authors = [
    { name = "sudoskys", email = "coldlando@hotmail.com" },
]
dependencies = [
    "pyromark>=0.7.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
mermaid = [
    "Pillow>=10.4.0",
    "aiohttp>=3.10.11",
]
tests = [
    "pyTelegramBotAPI>=4.22.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
repository = "https://github.com/sudoskys/telegramify-markdown"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true


[tool.pdm.scripts]
test = "python -m unittest discover -s ./tests -p test_*.py"
test-rich = "python -m unittest tests.test_rich"
test-live-rich = { cmd = "python -m unittest tests.test_server.TelegramRichMessageLiveTest", env = { TELEGRAM_LIVE_REQUIRED = "1" } }
test-live-stream = { cmd = "python -m unittest tests.test_server.TelegramStreamDraftLiveTest", env = { TELEGRAM_LIVE_REQUIRED = "1" } }
test-stream = "pytest tests/test_stream.py -v"

[tool.pytest.ini_options]
asyncio_mode = "auto"
